defaults:
  - experiment: example/MountainCar/EQRC
  - _self_
  - override hydra/launcher: joblib

seed: 0
save_path: null
checkpoint_path: ./checkpoints/
silent: false
gpu: false
exp_path: null

hydra:
  launcher:
    n_jobs: 32        # run with 32 CPUs

  sweep:
    # one subdir per (hidden, num_layers, seed) combo
    subdir: hidden=${experiment.metaParameters.representation.hidden},layers=${experiment.metaParameters.representation.num_layers}/${seed}

  sweeper:
    params:
      seed: 1,11,21,31,41,51,61,71,81,91
      experiment.metaParameters.representation.hidden: 16,32,75
      experiment.metaParameters.representation.num_layers: 1,2,3